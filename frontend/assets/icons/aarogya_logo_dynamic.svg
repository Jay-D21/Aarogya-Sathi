<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes pulse-outer {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    @keyframes pulse-inner {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    
    /* Light Theme (Default fallback) */
    .outer { 
      stroke: #111827; /* Dark navy for light background */
      stroke-width: 40; 
      stroke-linecap: round; 
      fill: none; 
      transform-origin: 256px 340px;
      animation: pulse-outer 4s infinite ease-in-out;
    }
    
    /* Dark Theme Overrides using OS media queries */
    @media (prefers-color-scheme: dark) {
      .outer { stroke: #FEF3C7; /* Cream for dark background */ }
    }

    /* Inner elements stay teal regardless of theme */
    .inner { 
      stroke: #10B981; 
      stroke-width: 40; 
      stroke-linecap: round; 
      fill: none; 
      transform-origin: 256px 340px;
      animation: pulse-inner 4s infinite ease-in-out;
    }
    .dot { 
      fill: #10B981; 
      transform-origin: 256px 340px;
      animation: pulse-inner 4s infinite ease-in-out;
    }
  </style>
  
  <!-- Removed background rect completely for transparency -->
  
  <path d="M 120 340 A 136 136 0 0 1 392 340" class="outer" />
  <path d="M 190 340 A 66 66 0 0 1 322 340" class="inner" />
  <circle cx="256" cy="340" r="24" class="dot" />
</svg>
