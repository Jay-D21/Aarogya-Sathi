version: "3.9"

services:
  # ── FastAPI Backend ──
  backend:
    build:
      context: ../backend
      dockerfile: ../devops/Dockerfile.backend
    container_name: aarogya-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - aarogya-network

  # ── PostgreSQL 15 ──
  postgres:
    image: postgres:15-alpine
    container_name: aarogya-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: arogya_sathi
      POSTGRES_USER: arogya_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arogya_dev_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arogya_user -d arogya_sathi"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - aarogya-network

  # ── Redis 7 ──
  redis:
    image: redis:7-alpine
    container_name: aarogya-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - aarogya-network

  # ── Nginx Reverse Proxy ──
  nginx:
    image: nginx:alpine
    container_name: aarogya-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - aarogya-network

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local

networks:
  aarogya-network:
    driver: bridge
