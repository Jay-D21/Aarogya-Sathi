<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aarogya Sathi - Icon 5: Shield Wellness</title>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            padding: 40px;
        }
        h1 { margin-bottom: 30px; color: #4CAF50; }
        .icon-container {
            background: radial-gradient(circle, #1e293b, #0f172a);
            padding: 60px;
            border-radius: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }
        .desc { margin-top: 30px; text-align: center; max-width: 400px; color: #94a3b8; }
        .badge {
            display: inline-block;
            padding: 8px 20px;
            background: rgba(76,175,80,0.2);
            color: #4CAF50;
            border-radius: 20px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Icon 5: Shield Wellness</h1>
    <div class="icon-container">
        <svg width="200" height="200" viewBox="0 0 140 140" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#4CAF50"/>
                    <stop offset="100%" style="stop-color:#2E7D32"/>
                </linearGradient>
            </defs>
            <!-- Shield shape -->
            <path d="M70 20 L110 35 L110 70 C110 100 90 120 70 130 C50 120 30 100 30 70 L30 35 L70 20Z"
                  fill="url(#shieldGrad)"/>
            <!-- Shield inner highlight -->
            <path d="M70 30 L100 42 L100 70 C100 92 85 108 70 117 C55 108 40 92 40 70 L40 42 L70 30Z"
                  fill="#388E3C" opacity="0.5"/>
            <!-- Heart in center -->
            <path d="M70 50 C70 50 52 60 52 72 C52 82 60 90 70 98 C80 90 88 82 88 72 C88 60 70 50 70 50Z"
                  fill="#FF6B6B"/>
            <!-- Pulse wave on heart -->
            <path d="M52 72 L62 72 L67 65 L73 80 L80 68 L88 72"
                  stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8"/>
            <!-- Small leaf accent -->
            <path d="M95 30 C95 30 105 25 110 30 C115 35 110 45 105 45 C100 45 95 38 95 30Z"
                  fill="#81C784"/>
        </svg>
    </div>
    <p class="desc">A protective shield with heart and pulse, representing health protection and the app as your health guardian.</p>
    <span class="badge">Protection & Trust</span>
</body>
</html>
