<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aarogya Sathi - Icon 3: S-Monogram</title>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            padding: 40px;
        }
        h1 { margin-bottom: 30px; color: #4CAF50; }
        .icon-container {
            background: radial-gradient(circle, #1e293b, #0f172a);
            padding: 60px;
            border-radius: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }
        .desc { margin-top: 30px; text-align: center; max-width: 400px; color: #94a3b8; }
        .badge {
            display: inline-block;
            padding: 8px 20px;
            background: rgba(76,175,80,0.2);
            color: #4CAF50;
            border-radius: 20px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Icon 3: S-Monogram Pulse</h1>
    <div class="icon-container">
        <svg width="200" height="200" viewBox="0 0 140 140" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="sGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#4CAF50"/>
                    <stop offset="50%" style="stop-color:#81C784"/>
                    <stop offset="100%" style="stop-color:#FF6B6B"/>
                </linearGradient>
            </defs>
            <!-- Stylized S with pulse integrated -->
            <path d="M95 40 C95 30 85 25 75 25 C60 25 50 35 50 45 C50 55 60 60 75 65 C90 70 100 75 100 90 C100 105 85 115 70 115 C50 115 35 100 35 80"
                  stroke="url(#sGrad)" stroke-width="10" stroke-linecap="round" fill="none"/>
            <!-- Pulse lines cutting through S -->
            <path d="M30 55 L50 55 L58 45 L68 65 L78 50 L88 60 L110 60"
                  stroke="#FF6B6B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <!-- Leaf accent top right -->
            <path d="M105 30 C105 30 115 35 120 45 C120 52 115 58 108 58 C100 58 95 50 95 45 C95 35 105 30 105 30Z"
                  fill="#4CAF50"/>
            <path d="M108 35 L108 52 M108 42 L115 48" stroke="#81C784" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
    </div>
    <p class="desc">Modern minimalist "S" for Sathi with integrated pulse waves, clean and memorable for app icon use.</p>
    <span class="badge">Modern & Clean</span>
</body>
</html>
