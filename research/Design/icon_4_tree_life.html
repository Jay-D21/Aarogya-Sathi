<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aarogya Sathi - Icon 4: Tree of Life</title>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            padding: 40px;
        }
        h1 { margin-bottom: 30px; color: #4CAF50; }
        .icon-container {
            background: radial-gradient(circle, #1e293b, #0f172a);
            padding: 60px;
            border-radius: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }
        .desc { margin-top: 30px; text-align: center; max-width: 400px; color: #94a3b8; }
        .badge {
            display: inline-block;
            padding: 8px 20px;
            background: rgba(76,175,80,0.2);
            color: #4CAF50;
            border-radius: 20px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Icon 4: Tree of Life</h1>
    <div class="icon-container">
        <svg width="200" height="200" viewBox="0 0 140 140" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="treeGrad" x1="0%" y1="100%" x2="0%" y2="0%">
                    <stop offset="0%" style="stop-color:#5D4037"/>
                    <stop offset="30%" style="stop-color:#795548"/>
                    <stop offset="100%" style="stop-color:#4CAF50"/>
                </linearGradient>
                <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#81C784"/>
                    <stop offset="100%" style="stop-color:#4CAF50"/>
                </linearGradient>
            </defs>
            <!-- Tree trunk -->
            <path d="M65 130 L65 80 C65 75 60 70 55 70 L55 65 C55 55 60 50 70 50 C80 50 85 55 85 65 L85 70 C80 70 75 75 75 80 L75 130"
                  fill="url(#treeGrad)"/>
            <!-- Heart-shaped canopy -->
            <path d="M70 15 C70 15 40 30 40 50 C40 65 55 75 70 85 C85 75 100 65 100 50 C100 30 70 15 70 15Z"
                  fill="url(#leafGrad)"/>
            <!-- Heart in canopy -->
            <path d="M70 35 C70 35 58 42 58 52 C58 58 63 62 70 68 C77 62 82 58 82 52 C82 42 70 35 70 35Z"
                  fill="#FF6B6B" opacity="0.7"/>
            <!-- Pulse line at base -->
            <path d="M35 125 L55 125 L62 118 L70 132 L78 118 L85 125 L105 125"
                  stroke="#FF6B6B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </div>
    <p class="desc">A tree with heart-shaped canopy and pulse roots, symbolizing growth, vitality, and grounded wellness.</p>
    <span class="badge">Nature & Growth</span>
</body>
</html>
