# ============================================
# Backend (FastAPI) — Deployment
# ============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: aarogya-sathi
  labels:
    app: aarogya-sathi
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aarogya-sathi
      component: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: aarogya-sathi
        component: backend
    spec:
      containers:
        - name: backend
          image: jayd21/aarogya-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DATABASE_URL
              value: "postgresql+asyncpg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres-service:5432/aarogya_sathi"
            - name: REDIS_URL
              value: "redis://redis-service:6379/0"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: aarogya-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aarogya-secrets
                  key: POSTGRES_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: aarogya-secrets
                  key: JWT_SECRET
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: aarogya-secrets
                  key: GOOGLE_API_KEY
          envFrom:
            - configMapRef:
                name: aarogya-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
