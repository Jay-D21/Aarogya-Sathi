# ============================================
# Redis — Service (ClusterIP)
# ============================================
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: aarogya-sathi
  labels:
    app: aarogya-sathi
    component: cache
spec:
  type: ClusterIP
  selector:
    app: aarogya-sathi
    component: cache
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      name: redis
