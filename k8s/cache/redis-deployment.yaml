# ============================================
# Redis — Deployment
# ============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: aarogya-sathi
  labels:
    app: aarogya-sathi
    component: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aarogya-sathi
      component: cache
  template:
    metadata:
      labels:
        app: aarogya-sathi
        component: cache
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - containerPort: 6379
              name: redis
          volumeMounts:
            - name: redis-storage
              mountPath: /data
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: redis-storage
          persistentVolumeClaim:
            claimName: redis-pvc
