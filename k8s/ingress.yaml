# ============================================
# Aarogya Sathi — Ingress (Path-based Routing)
# ============================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aarogya-ingress
  namespace: aarogya-sathi
  labels:
    app: aarogya-sathi
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  ingressClassName: nginx
  rules:
    - host: aarogya-sathi.local
      http:
        paths:
          # API requests → Backend
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8000
          # Health check → Backend
          - path: /health
            pathType: Exact
            backend:
              service:
                name: backend-service
                port:
                  number: 8000
          # Everything else → Frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
