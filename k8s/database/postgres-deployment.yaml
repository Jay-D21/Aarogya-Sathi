# ============================================
# PostgreSQL — Deployment
# ============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: aarogya-sathi
  labels:
    app: aarogya-sathi
    component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aarogya-sathi
      component: database
  strategy:
    type: Recreate    # DB should not have rolling updates
  template:
    metadata:
      labels:
        app: aarogya-sathi
        component: database
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: aarogya-config
                  key: DATABASE_NAME
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: aarogya-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aarogya-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - aarogya_admin
                - -d
                - aarogya_sathi
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - aarogya_admin
                - -d
                - aarogya_sathi
            initialDelaySeconds: 30
            periodSeconds: 15
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
