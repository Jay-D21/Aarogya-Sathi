# ============================================
# PostgreSQL — Service (ClusterIP)
# ============================================
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: aarogya-sathi
  labels:
    app: aarogya-sathi
    component: database
spec:
  type: ClusterIP
  selector:
    app: aarogya-sathi
    component: database
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
